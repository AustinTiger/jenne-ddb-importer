<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        width: 260px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 12px;
        background-color: #191512;
        color: #f0ebe4;
      }
      h3 {
        margin: 0 0 10px 0;
        color: #d4a857;
        font-size: 13px;
        border-bottom: 1px solid rgba(212, 168, 87, 0.3);
        padding-bottom: 6px;
        text-align: center;
        letter-spacing: 0.05em;
      }
      button {
        width: 100%;
        padding: 8px;
        background-color: #2a221b;
        border: 1px solid #d4a857;
        color: #d4a857;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      button:hover {
        background-color: #d4a857;
        color: #191512;
      }
      .status {
        margin-top: 8px;
        font-size: 11px;
        color: #a3a3a3;
        text-align: center;
      }
      .success {
        color: #a3e635;
      }
    </style>
  </head>
  <body>
    <h3>DDB Cobalt Cookie Helper</h3>
    <button id="btn-copy">Copy Cobalt Cookie</button>
    <div id="status" class="status">Click to copy your cookie.</div>
    <script src="popup.js"></script>
  </body>
</html>
